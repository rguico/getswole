<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Swole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <select id="user-select" class="big-select">
      <option value="" disabled selected>Choose a lifter</option>
      <option value="Robert">Robert</option>
      <option value="Jennie">Jennie</option>
    </select>
  </header>

  <main id="app">
    <section id="session-input" hidden>
      <label for="machine-select">Machine</label>
      <select id="machine-select" class="big-select">
        <option value="" disabled selected>Choose a machine</option>
      </select>

      <form id="entry-form">
        <label for="entry-input">Add set (e.g. "10 x 55, 60, 50")</label>
        <input type="text" id="entry-input" class="big-select" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <p id="entry-feedback"></p>

      <div id="recent-sets"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
